name: smartreminder
description: "DueMate – Smart Reminder: Never miss what's important."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0-327.4.beta

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.4
  path_provider: ^2.1.3
  path: ^1.9.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  flutter_timezone: ^5.0.0

  # State management & navigation
  flutter_riverpod: ^2.5.0
  go_router: ^13.2.0

  # Permissions
  permission_handler: ^11.3.0

  # Localization
  intl: ^0.20.2

  # Preferences
  shared_preferences: ^2.3.0

  # Backup / file I/O
  file_picker: ^13.0.0
  share_plus: ^13.0.0

  # Utils
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8

dependency_overrides:
  shared_preferences_android: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
